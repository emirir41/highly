<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Highly Bütçe</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1842711344931829" crossorigin="anonymous"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
[data-theme=dark]{--bg:#06070f;--s1:#0b0d1c;--s2:#0f1125;--b:rgba(255,255,255,.07);--b2:rgba(255,255,255,.14);--a1:#818cf8;--a2:#4f6ef7;--t:#e8e8ff;--m:#7a7e9e;--nav:rgba(6,7,15,.95);--menu:#0d0f20;--h:rgba(255,255,255,.05);--up:#34d399;--dn:#f87171}
[data-theme=glass]{--bg:linear-gradient(135deg,#0a0f2e,#0d1635 50%,#0a1628);--s1:rgba(255,255,255,.06);--s2:rgba(255,255,255,.1);--b:rgba(255,255,255,.12);--b2:rgba(255,255,255,.2);--a1:#a5b4fc;--a2:#818cf8;--t:#f0f4ff;--m:rgba(255,255,255,.55);--nav:rgba(10,15,46,.7);--menu:rgba(8,12,40,.9);--h:rgba(255,255,255,.07);--up:#34d399;--dn:#f87171}
[data-theme=light]{--bg:#f0f2f8;--s1:#fff;--s2:#f5f6fa;--b:rgba(0,0,0,.08);--b2:rgba(0,0,0,.14);--a1:#4f6ef7;--a2:#3b57d9;--t:#1a1b2e;--m:#6b7090;--nav:rgba(240,242,248,.95);--menu:#fff;--h:rgba(0,0,0,.05);--up:#059669;--dn:#dc2626}
body{background:var(--bg);color:var(--t);font-family:'DM Sans',sans-serif;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;transition:background .3s,color .3s}
body::before{content:'';position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 20% 20%,rgba(129,140,248,.07),transparent 55%),radial-gradient(ellipse at 80% 80%,rgba(79,110,247,.05),transparent 55%)}
nav{position:relative;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:12px 24px;background:var(--nav);border-bottom:1px solid var(--b);backdrop-filter:blur(20px);flex-shrink:0}
.logo{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--t)}
.ni{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--a1),var(--a2));display:flex;align-items:center;justify-content:center;font-family:Syne,sans-serif;font-weight:800;font-size:14px;color:#fff}
.nt{font-family:Syne,sans-serif;font-weight:800;font-size:17px}
.nr{display:flex;align-items:center;gap:8px}
.ib{width:36px;height:36px;background:var(--s1);border:1px solid var(--b);border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--t);text-decoration:none;font-size:15px}
.ib:hover{border-color:var(--b2)}
.btn{display:flex;align-items:center;gap:7px;padding:8px 18px;background:linear-gradient(135deg,var(--a1),var(--a2));border:none;border-radius:999px;color:#fff;font-family:Syne,sans-serif;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(129,140,248,.3);text-decoration:none}
.btn:hover{opacity:.85}
.uc{display:none;align-items:center;gap:8px;background:var(--s1);border:1px solid var(--b);border-radius:999px;padding:5px 12px 5px 6px;color:var(--t);font-size:13px;text-decoration:none}
.av{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,var(--a1),var(--a2));display:flex;align-items:center;justify-content:center;font-family:Syne,sans-serif;font-weight:800;font-size:11px;color:#fff}
.pd{position:fixed;top:56px;right:24px;width:200px;border:1px solid var(--b2);border-radius:16px;z-index:160;background:var(--menu);box-shadow:0 16px 48px rgba(0,0,0,.4);opacity:0;pointer-events:none;transform:translateY(-8px);transition:all .25s;overflow:hidden}
.pd.show{opacity:1;pointer-events:all;transform:none}
.pd a,.pd button{display:flex;gap:10px;padding:12px 14px;width:100%;border:none;background:none;color:var(--t);font:13px 'DM Sans',sans-serif;text-decoration:none;cursor:pointer;text-align:left}
.pd a:hover,.pd button:hover{background:var(--s2)}
.ly{display:flex;flex:1;overflow:hidden;position:relative;z-index:2}
.sb{width:270px;flex-shrink:0;background:var(--s1);border-right:1px solid var(--b);overflow-y:auto;padding:16px}
.lbl{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--m);margin-bottom:8px}
.row{display:flex;align-items:center;gap:10px;padding:8px;border-radius:9px;cursor:pointer;font-size:13px;border:none;background:none;color:var(--t);width:100%;text-align:left;font-family:inherit}
.row:hover{background:var(--h)}.row.on{background:var(--h);font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.cnt{margin-left:auto;font-size:11px;color:var(--m)}
.mn{flex:1;display:flex;flex-direction:column;overflow:hidden}
.tb{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 24px;border-bottom:1px solid var(--b);flex-shrink:0;flex-wrap:wrap}
.tl{display:flex;align-items:center;gap:10px}
.tt{font-family:Syne,sans-serif;font-size:20px;font-weight:800;letter-spacing:-.5px;min-width:130px;text-align:center}
.tbn{background:var(--h);border:1px solid var(--b);border-radius:8px;width:32px;height:32px;color:var(--t);cursor:pointer;font-size:16px}
.tbn:hover{border-color:var(--b2)}
.today{padding:7px 16px;background:rgba(129,140,248,.1);border:1px solid rgba(129,140,248,.25);border-radius:8px;color:var(--a1);font:600 12px 'DM Sans',sans-serif;cursor:pointer}
.vt{display:flex;gap:3px;background:var(--h);border-radius:9px;padding:3px}
.vtab{padding:6px 14px;border:none;background:none;color:var(--m);font:600 12px 'DM Sans',sans-serif;border-radius:7px;cursor:pointer}
.vtab.on{background:var(--a1);color:#fff}
.bd{flex:1;overflow:auto;padding:16px 24px 28px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.card{background:var(--s2);border:1px solid var(--b);border-radius:14px;padding:16px 18px}
.sl{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--m);margin-bottom:8px}
.sv{font-family:Syne,sans-serif;font-size:24px;font-weight:800;letter-spacing:-.5px}
.up{color:var(--up)}.dn{color:var(--dn)}.ac{color:var(--a1)}
.ss{font-size:11px;color:var(--m);margin-top:4px}
.fl{display:flex;gap:10px;margin-bottom:16px;align-items:center;flex-wrap:wrap}
.chip{padding:6px 14px;border:1px solid var(--b);background:var(--s1);border-radius:999px;color:var(--m);font:600 12px 'DM Sans',sans-serif;cursor:pointer}
.chip.on{background:var(--a1);color:#fff;border-color:var(--a1)}
.fi{background:var(--h);border:1px solid var(--b);border-radius:9px;padding:10px 13px;color:var(--t);font:14px 'DM Sans',sans-serif;outline:none;width:100%}
.fi:focus{border-color:var(--a1)}.fi option{background:var(--menu);color:var(--t)}
#cs{display:none;width:auto;padding:6px 10px;font-size:12px}
.dh{display:flex;align-items:center;gap:12px;margin:18px 0 10px}
.db{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--a1),var(--a2));display:flex;align-items:center;justify-content:center;font:800 16px Syne,sans-serif;color:#fff;flex-shrink:0}
.dl{font:800 15px Syne,sans-serif}.ds{font-size:11px;color:var(--a1)}
.tx{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--s2);border:1px solid var(--b);border-left-width:3px;border-radius:11px;margin-bottom:7px;cursor:pointer;transition:all .15s}
.tx:hover{background:var(--h);transform:translateX(2px)}
.ti{font-size:18px}.tn{flex:1;min-width:0}.tn b{display:block;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tn small{font-size:11px;color:var(--m)}
.ta{font:800 15px Syne,sans-serif}
.empty{text-align:center;color:var(--m);padding:56px 10px;line-height:2;font-size:14px}
.bars{display:flex;gap:10px;align-items:flex-end;height:130px}
.bg{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
.bp{display:flex;gap:3px;align-items:flex-end;height:110px}
.bar{width:14px;border-radius:4px 4px 0 0;min-height:3px}
.bl{font-size:10px;color:var(--m)}.bg.cur .bl{color:var(--a1);font-weight:700}
.cb{height:6px;border-radius:4px;background:var(--h);margin-top:6px;overflow:hidden}.cb i{display:block;height:100%;border-radius:4px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(10px);z-index:1000;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
.ov.open{opacity:1;pointer-events:all}
.md{background:var(--s1);border:1px solid var(--b2);border-radius:20px;padding:26px;width:420px;max-width:92vw;max-height:92dvh;overflow:auto;box-shadow:0 32px 80px rgba(0,0,0,.6);transform:translateY(24px) scale(.97);transition:transform .25s}
[data-theme=light] .md{background:#fff}
.ov.open .md{transform:none}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;font:800 17px Syne,sans-serif}
.x{background:var(--h);border:none;color:var(--m);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:16px}
.x:hover{color:var(--dn)}
.tg{display:flex;gap:6px;margin-bottom:14px}
.tgb{flex:1;padding:10px;border:1px solid var(--b);background:none;border-radius:10px;color:var(--m);font:700 13px Syne,sans-serif;cursor:pointer}
.tgb.on.i{background:rgba(52,211,153,.15);border-color:var(--up);color:var(--up)}
.tgb.on.e{background:rgba(248,113,113,.15);border-color:var(--dn);color:var(--dn)}
.fd{margin-bottom:13px}.fd label{display:block;font-size:10px;font-weight:700;color:var(--m);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.cps{display:flex;gap:6px;flex-wrap:wrap}
.cp{padding:6px 11px;border:1px solid var(--b);border-radius:999px;font-size:12px;cursor:pointer;background:none;color:var(--t);font-family:inherit}
.cp.on{border-color:var(--a1);background:rgba(129,140,248,.18);font-weight:600}
.mf{display:flex;gap:8px;margin-top:18px}
.mb{flex:1;padding:11px;border:none;border-radius:9px;font:700 13px Syne,sans-serif;cursor:pointer}
.mb:hover{opacity:.85}.mb.p{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff}
.mb.g{background:var(--h);color:var(--m)}.mb.d{background:rgba(248,113,113,.15);color:var(--dn)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--s1);border:1px solid rgba(129,140,248,.3);border-radius:10px;padding:11px 20px;font-size:13px;color:var(--a1);opacity:0;z-index:9999;transition:all .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%)}
@media(max-width:760px){.sb{display:none}#cs{display:block}.sum{grid-template-columns:1fr}.sv{font-size:21px}.bd,.tb{padding-left:14px;padding-right:14px}nav{padding:10px 14px}.nt{display:none}}
</style>
</head>
<body>
<nav>
  <a href="dashboard.html" class="logo"><div class="ni">H</div><span class="nt">Highly Bütçe</span></a>
  <div class="nr">
    <button class="btn" id="add">+ İşlem Ekle</button>
    <a href="dashboard.html" class="ib" title="Dashboard'a dön">←</a>
    <a href="#" class="uc" id="uc"><div class="av" id="nav-av">?</div><span id="nav-nm">...</span></a>
    <a href="highly-id.html" class="btn" id="lb" style="display:none">🔐 Giriş Yap</a>
  </div>
</nav>
<div class="pd" id="pd"><a href="dashboard.html">🏠 Dashboard'a dön</a><button id="out">🚪 Çıkış Yap</button></div>
<div class="ly">
  <aside class="sb"><div class="lbl">Kategoriler</div><div id="cats"></div></aside>
  <div class="mn">
    <div class="tb">
      <div class="tl"><button class="tbn" id="pv">‹</button><span class="tt" id="tt"></span><button class="tbn" id="nx">›</button><button class="today" id="td">Bugün</button></div>
      <div class="vt"><button class="vtab on" data-v="l">İşlemler</button><button class="vtab" data-v="s">Özet</button></div>
    </div>
    <div class="bd">
      <div class="sum" id="sum"></div>
      <div id="vl">
        <div class="fl"><button class="chip on" data-t="all">Tümü</button><button class="chip" data-t="income">Gelir</button><button class="chip" data-t="expense">Gider</button><select class="fi" id="cs"></select></div>
        <div id="list"></div>
      </div>
      <div id="vs" style="display:none"></div>
    </div>
  </div>
</div>
<div class="ov" id="ov"><div class="md">
  <div class="mh"><span id="mt">İşlem Ekle</span><button class="x" id="cl">✕</button></div>
  <div class="tg"><button class="tgb i on" data-m="income">📈 Gelir</button><button class="tgb e" data-m="expense">📉 Gider</button></div>
  <div class="fd"><label>Açıklama *</label><input class="fi" id="fd" placeholder="Maaş, kira, market..."/></div>
  <div class="fd"><label>Tutar (₺) *</label><input class="fi" id="fa" type="number" min="0" step="0.01" placeholder="0,00"/></div>
  <div class="fd"><label>Kategori</label><div class="cps" id="cp"></div></div>
  <div class="fd"><label>Tarih</label><input class="fi" id="fdt" type="date"/></div>
  <div class="mf"><button class="mb g" id="ca">İptal</button><button class="mb d" id="dl" style="display:none">Sil</button><button class="mb p" id="sv">Kaydet</button></div>
</div></div>
<div class="toast" id="toast"></div>
<script>
document.documentElement.setAttribute('data-theme',localStorage.getItem('highly_theme')||'dark');
addEventListener('storage',e=>{if(e.key==='highly_theme')document.documentElement.setAttribute('data-theme',e.newValue||'dark')});
const $=id=>document.getElementById(id);
const user=(()=>{try{return JSON.parse(localStorage.getItem('highly_user'))}catch{return null}})();
if(user&&user.name){
  $('nav-av').textContent=user.avatarEmoji||user.name[0].toUpperCase();
  if(user.avatarBg&&!user.avatarEmoji)$('nav-av').style.background=user.avatarBg;
  $('nav-nm').textContent=user.name.split(' ')[0];$('uc').style.display='flex';
  $('uc').onclick=e=>{e.preventDefault();$('pd').classList.toggle('show')};
}else $('lb').style.display='flex';
$('out').onclick=()=>{localStorage.removeItem('highly_user');location.reload()};
document.addEventListener('click',e=>{if(!$('pd').contains(e.target)&&!$('uc').contains(e.target))$('pd').classList.remove('show')});
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}

const CAT={'Maaş':['💼','#34d399','income'],'Freelance':['💻','#38bdf8','income'],'Yatırım':['📊','#a78bfa','income'],'Diğer Gelir':['💰','#818cf8','income'],
'Market':['🛒','#f59e0b','expense'],'Kira':['🏠','#f87171','expense'],'Fatura':['📄','#fb923c','expense'],'Ulaşım':['🚗','#38bdf8','expense'],'Yemek':['🍔','#f472b6','expense'],
'Eğlence':['🎬','#a78bfa','expense'],'Sağlık':['🏥','#34d399','expense'],'Giyim':['👕','#818cf8','expense'],'Diğer Gider':['💸','#94a3b8','expense']};
const MN=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const ci=c=>(CAT[c]||['💳','#94a3b8'])[0],cc=c=>(CAT[c]||['💳','#94a3b8'])[1];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>'₺'+n.toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2});
const load=()=>{try{return JSON.parse(localStorage.getItem('highly_budget')||'[]')}catch{return[]}};
const save=a=>localStorage.setItem('highly_budget',JSON.stringify(a));
const now=new Date();
let Y=now.getFullYear(),Mo=now.getMonth(),ft='all',fc='all',view='l',editId=null,mType='income',selCat='Maaş';
const ym=()=>`${Y}-${String(Mo+1).padStart(2,'0')}`;
const sum=(a,t)=>a.filter(x=>x.type===t).reduce((s,x)=>s+x.amount,0);

function render(){
  const all=load(),mo=all.filter(t=>t.date.startsWith(ym()));
  $('tt').textContent=`${MN[Mo]} ${Y}`;
  const bal=all.reduce((s,t)=>t.type==='income'?s+t.amount:s-t.amount,0),inc=sum(mo,'income'),exp=sum(mo,'expense');
  const n=t=>mo.filter(x=>x.type===t).length;
  $('sum').innerHTML=`<div class="card"><div class="sl">Toplam bakiye</div><div class="sv ${bal<0?'dn':'ac'}">${fmt(bal)}</div><div class="ss">Tüm zamanlar</div></div>
  <div class="card"><div class="sl">Gelir</div><div class="sv up">${fmt(inc)}</div><div class="ss">${n('income')} işlem · ${MN[Mo]}</div></div>
  <div class="card"><div class="sl">Gider</div><div class="sv dn">${fmt(exp)}</div><div class="ss">${n('expense')} işlem · ${MN[Mo]}</div></div>`;
  const used=[...new Set(mo.map(t=>t.category))];
  const tot=c=>mo.filter(t=>t.category===c).reduce((s,t)=>s+t.amount,0);
  $('cats').innerHTML=`<button class="row${fc==='all'?' on':''}" data-c="all">Tüm kategoriler<span class="cnt">${mo.length}</span></button>`+
    used.map(c=>`<button class="row${fc===c?' on':''}" data-c="${esc(c)}"><span class="dot" style="background:${cc(c)}"></span>${ci(c)} ${esc(c)}<span class="cnt">${fmt(tot(c))}</span></button>`).join('')||'';
  $('cs').innerHTML=`<option value="all">Tüm kategoriler</option>`+used.map(c=>`<option value="${esc(c)}">${ci(c)} ${esc(c)}</option>`).join('');
  if(fc!=='all'&&!used.includes(fc))fc='all';
  $('cs').value=fc;
  document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{fc=b.dataset.c;render()});
  view==='l'?renderList(mo):renderSum(all,mo,exp);
}
function renderList(mo){
  let a=mo.filter(t=>(ft==='all'||t.type===ft)&&(fc==='all'||t.category===fc)).sort((p,q)=>q.date.localeCompare(p.date)||q.id.localeCompare(p.id));
  if(!a.length){$('list').innerHTML=`<div class="empty">💸 ${MN[Mo]} ayında işlem yok.<br><button class="btn" style="margin:8px auto 0" onclick="openAdd()">+ İşlem ekle</button></div>`;return}
  const g={};a.forEach(t=>(g[t.date]=g[t.date]||[]).push(t));
  $('list').innerHTML=Object.keys(g).map(d=>{
    const net=g[d].reduce((s,t)=>t.type==='income'?s+t.amount:s-t.amount,0),dt=new Date(d+'T00:00:00');
    return`<div class="dh"><div class="db">${dt.getDate()}</div><div><div class="dl">${dt.toLocaleDateString('tr-TR',{weekday:'long'})}</div><div class="ds">${dt.getDate()} ${MN[dt.getMonth()]} · net ${net<0?'-':''}${fmt(Math.abs(net))}</div></div></div>`+
    g[d].map(t=>`<div class="tx" data-id="${t.id}" style="border-left-color:${cc(t.category)}"><span class="ti">${ci(t.category)}</span><div class="tn"><b>${esc(t.desc)}</b><small>${esc(t.category)}</small></div><div class="ta ${t.type==='income'?'up':'dn'}">${t.type==='income'?'+':'-'}${fmt(t.amount)}</div></div>`).join('');
  }).join('');
  document.querySelectorAll('.tx').forEach(el=>el.onclick=()=>openEdit(el.dataset.id));
}
function renderSum(all,mo,exp){
  const mx=Math.max(1,...Array.from({length:6},(_,i)=>{const k=mk(i);const m=all.filter(t=>t.date.startsWith(k));return Math.max(sum(m,'income'),sum(m,'expense'))}));
  const bars=Array.from({length:6},(_,i)=>{
    const k=mk(i),m=all.filter(t=>t.date.startsWith(k)),inc=sum(m,'income'),ex=sum(m,'expense'),mi=+k.slice(5)-1;
    return`<div class="bg${k===ym()?' cur':''}" data-k="${k}" title="Gelir ${fmt(inc)} · Gider ${fmt(ex)}"><div class="bp"><div class="bar" style="height:${inc/mx*100}%;background:var(--up)"></div><div class="bar" style="height:${ex/mx*100}%;background:var(--dn)"></div></div><div class="bl">${MN[mi].slice(0,3)}</div></div>`}).join('');
  const bc={};mo.filter(t=>t.type==='expense').forEach(t=>bc[t.category]=(bc[t.category]||0)+t.amount);
  const rows=Object.entries(bc).sort((p,q)=>q[1]-p[1]).map(([c,v])=>`<div style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;font-size:13px"><span>${ci(c)} ${esc(c)}</span><b>${fmt(v)} <span style="color:var(--m);font-weight:400">%${Math.round(v/exp*100)}</span></b></div><div class="cb"><i style="width:${v/exp*100}%;background:${cc(c)}"></i></div></div>`).join('');
  $('vs').innerHTML=`<div class="card" style="margin-bottom:14px"><div class="sl">Son 6 ay · <span class="up">gelir</span> / <span class="dn">gider</span></div><div class="bars">${bars}</div></div>
  <div class="card"><div class="sl">${MN[Mo]} gider dağılımı</div>${rows||'<div class="empty">Bu ay gider yok.</div>'}</div>`;
  document.querySelectorAll('.bg').forEach(b=>b.onclick=()=>{Y=+b.dataset.k.slice(0,4);Mo=+b.dataset.k.slice(5)-1;render()});
}
function mk(i){const d=new Date(Y,Mo-5+i,1);return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}

function buildCp(){
  $('cp').innerHTML=Object.keys(CAT).filter(c=>CAT[c][2]===mType).map(c=>`<button type="button" class="cp${c===selCat?' on':''}" data-c="${esc(c)}">${CAT[c][0]} ${esc(c)}</button>`).join('');
  $('cp').querySelectorAll('.cp').forEach(b=>b.onclick=()=>{selCat=b.dataset.c;buildCp()});
}
function setType(t){
  mType=t;selCat=Object.keys(CAT).find(c=>CAT[c][2]===t);
  document.querySelectorAll('.tgb').forEach(b=>b.classList.toggle('on',b.dataset.m===t));buildCp();
}
function openAdd(){
  editId=null;$('mt').textContent='İşlem Ekle';$('dl').style.display='none';setType('income');
  $('fd').value='';$('fa').value='';
  const cur=Y===now.getFullYear()&&Mo===now.getMonth();
  $('fdt').value=cur?`${ym()}-${String(now.getDate()).padStart(2,'0')}`:`${ym()}-01`;
  $('ov').classList.add('open');setTimeout(()=>$('fd').focus(),300);
}
function openEdit(id){
  const t=load().find(x=>x.id===id);if(!t)return;
  editId=id;$('mt').textContent='İşlemi Düzenle';$('dl').style.display='block';setType(t.type);
  if(CAT[t.category]&&CAT[t.category][2]===t.type)selCat=t.category;buildCp();
  $('fd').value=t.desc;$('fa').value=t.amount;$('fdt').value=t.date;$('ov').classList.add('open');
}
const closeM=()=>{$('ov').classList.remove('open');editId=null};
$('add').onclick=openAdd;$('cl').onclick=closeM;$('ca').onclick=closeM;
$('ov').onclick=e=>{if(e.target===$('ov'))closeM()};
document.querySelectorAll('.tgb').forEach(b=>b.onclick=()=>setType(b.dataset.m));
$('sv').onclick=()=>{
  const desc=$('fd').value.trim(),amount=parseFloat($('fa').value),date=$('fdt').value;
  if(!desc)return toast('Açıklama gerekli!');
  if(!amount||amount<=0)return toast('Geçerli bir tutar gir!');
  if(!date)return toast('Tarih seç!');
  const a=load(),t={id:editId||Date.now().toString(),type:mType,desc,amount,category:selCat,date};
  if(editId){const i=a.findIndex(x=>x.id===editId);if(i>-1)a[i]=t}else a.push(t);
  save(a);const ed=!!editId;closeM();Y=+date.slice(0,4);Mo=+date.slice(5,7)-1;render();
  toast(ed?'✅ Güncellendi!':mType==='income'?'📈 Gelir eklendi!':'📉 Gider eklendi!');
};
$('dl').onclick=()=>{
  if(!editId||!confirm('Bu işlemi silmek istediğine emin misin?'))return;
  save(load().filter(t=>t.id!==editId));closeM();render();toast('🗑 Silindi');
};
$('pv').onclick=()=>{Mo--;if(Mo<0){Mo=11;Y--}render()};
$('nx').onclick=()=>{Mo++;if(Mo>11){Mo=0;Y++}render()};
$('td').onclick=()=>{Y=now.getFullYear();Mo=now.getMonth();render()};
$('cs').onchange=e=>{fc=e.target.value;render()};
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{ft=b.dataset.t;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b));render()});
document.querySelectorAll('.vtab').forEach(b=>b.onclick=()=>{
  view=b.dataset.v;document.querySelectorAll('.vtab').forEach(x=>x.classList.toggle('on',x===b));
  $('vl').style.display=view==='l'?'block':'none';$('vs').style.display=view==='s'?'block':'none';render();
});
addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});
render();
</script>
</body>
</html>
